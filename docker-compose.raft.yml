# Five physical matching nodes. Every node hosts four independent Raft groups;
# each group has one replica on every node and owns an isolated consensus WAL,
# in-memory matching snapshot, application proofs and execution Outbox.
x-raft-environment: &raft-environment
  # Structured-log level and panic backtraces for every Raft member.
  TC_LOG: "${TC_LOG:-info}"
  RUST_BACKTRACE: "${RUST_BACKTRACE:-1}"
  # Warn when an execution Outbox/application-proof durability boundary exceeds
  # this many milliseconds. The command itself is already durable in Raft WAL.
  TC_SLOW_FSYNC_WARN_MS: "${TC_SLOW_FSYNC_WARN_MS:-50}"
  TC_MATCH_POOL_PER_ASSET: "${TC_MATCH_POOL_PER_ASSET:-2}"
  TC_RAFT_TRANSPORT_QUEUE: "${TC_RAFT_TRANSPORT_QUEUE:-8192}"
  TC_COMMITTED_MAX_SESSIONS: "${TC_COMMITTED_MAX_SESSIONS:-256}"
  TC_COMMITTED_SESSION_IDLE_TIMEOUT_MS: "${TC_COMMITTED_SESSION_IDLE_TIMEOUT_MS:-300000}"
  TC_MD_MAX_SUBSCRIBERS: "${TC_MD_MAX_SUBSCRIBERS:-64}"
  TC_MD_SUBSCRIBER_QUEUE: "${TC_MD_SUBSCRIBER_QUEUE:-4096}"
  TC_MD_WRITE_TIMEOUT_MS: "${TC_MD_WRITE_TIMEOUT_MS:-5000}"
  TC_RAFT_READY_MAX_APPLY_LAG: "${TC_RAFT_READY_MAX_APPLY_LAG:-32}"
  TC_RAFT_READY_MAX_OUTBOX_PENDING: "${TC_RAFT_READY_MAX_OUTBOX_PENDING:-10000}"
  TC_SUPERVISOR_START_CONCURRENCY: "${TC_SUPERVISOR_START_CONCURRENCY:-16}"
  TC_SUPERVISOR_STARTUP_JITTER_MS: "${TC_SUPERVISOR_STARTUP_JITTER_MS:-2000}"
  TC_SUPERVISOR_STARTUP_SLOT_TIMEOUT_SECS: "${TC_SUPERVISOR_STARTUP_SLOT_TIMEOUT_SECS:-300}"
  TC_SUPERVISOR_LIVENESS_GRACE_SECS: "${TC_SUPERVISOR_LIVENESS_GRACE_SECS:-120}"
  TC_SUPERVISOR_LIVENESS_FAILURES: "${TC_SUPERVISOR_LIVENESS_FAILURES:-6}"
  TC_SUPERVISOR_MAX_GROUPS: "${TC_SUPERVISOR_MAX_GROUPS:-1024}"
  TC_RAFT_CHILD_NOFILE: "${TC_RAFT_CHILD_NOFILE:-16384}"
  TC_RAFT_CHILD_MAX_ADDRESS_SPACE_MB: "${TC_RAFT_CHILD_MAX_ADDRESS_SPACE_MB:-0}"
  TC_RAFT_DEDUP_MAX_IDS: "${TC_RAFT_DEDUP_MAX_IDS:-1000000}"
  # Deterministic config: must be identical on every replica of a group. A new
  # leader announces its fingerprint in the log and a replica that differs
  # stops applying (exit 78) instead of silently diverging. Set
  # TC_RAFT_CONFIG_CHECK=0 only while rolling from a build without the check.
  TC_INSTRUMENT_SPECS: "${TC_INSTRUMENT_SPECS:-}"
  TC_DEDUP_WINDOW_IDS: "${TC_DEDUP_WINDOW_IDS:-500000}"
  TC_RAFT_CONFIG_CHECK: "${TC_RAFT_CONFIG_CHECK:-1}"
  # 1 on every replica only for a coordinated whole-group config change.
  TC_RAFT_CONFIG_ADOPT: "${TC_RAFT_CONFIG_ADOPT:-0}"
  # Durable in-memory engine snapshot cadence. Recovery loads this image and
  # deterministically replays the committed Raft tail above its embedded index.
  TC_SNAPSHOT_EVERY_SECS: "${TC_SNAPSHOT_EVERY_SECS:-30}"
  # Compact only after a matching snapshot and execution-outbox drain cover
  # the same applied index; that application snapshot is shipped with Raft.
  TC_RAFT_COMPACT_APPLIED_THRESHOLD: "${TC_RAFT_COMPACT_APPLIED_THRESHOLD:-1000}"
  TC_ORDER_CATEGORY_SIZE: "${TC_ORDER_CATEGORY_SIZE:-1000}"
  TC_EXECUTION_OUTBOX_SYNC_EVERY: "${TC_EXECUTION_OUTBOX_SYNC_EVERY:-1}"
  TC_EXECUTION_PUBLISH_BATCH: "${TC_EXECUTION_PUBLISH_BATCH:-4096}"
  TC_EXECUTION_KAFKA_LINGER_MS: "${TC_EXECUTION_KAFKA_LINGER_MS:-2}"
  TC_EXECUTION_KAFKA_BATCH_MESSAGES: "${TC_EXECUTION_KAFKA_BATCH_MESSAGES:-10000}"
  TC_EXECUTION_KAFKA_COMPRESSION: "${TC_EXECUTION_KAFKA_COMPRESSION:-lz4}"
  TC_EXECUTION_KAFKA_QUEUE_KBYTES: "${TC_EXECUTION_KAFKA_QUEUE_KBYTES:-1048576}"
  TC_EXECUTION_KAFKA_DELIVERY_TIMEOUT_MS: "${TC_EXECUTION_KAFKA_DELIVERY_TIMEOUT_MS:-15000}"
  TC_EXECUTION_KAFKA_BROKERS: "${TC_EXECUTION_KAFKA_BROKERS:-redpanda:9092,redpanda-2:9092,redpanda-3:9092}"
  TC_EXECUTION_PUBLISH_ENABLED: "${TC_EXECUTION_PUBLISH_ENABLED:-true}"
  TC_EXECUTION_KAFKA_TOPIC: "${TC_EXECUTION_KAFKA_TOPIC:-trade-executions-v1}"
  TC_EXECUTION_CURSOR_TOPIC: "${TC_EXECUTION_CURSOR_TOPIC:-trade-execution-outbox-cursors-v1}"
  TC_EXECUTION_CURSOR_PARTITIONS: "${TC_EXECUTION_CURSOR_PARTITIONS:-16}"
  TC_EXECUTION_CURSOR_EVERY_BATCHES: "${TC_EXECUTION_CURSOR_EVERY_BATCHES:-16}"
  # Routing: the node places each execution event on the Kafka partition of
  # its order's database, so these must equal order-api's (same defaults).
  TC_EXECUTION_KAFKA_PARTITIONS: "${TC_EXECUTION_KAFKA_PARTITIONS:-16}"
  TC_DB_COUNT: "${TC_DB_COUNT:-10}"
  TC_TABLES_PER_DB: "${TC_TABLES_PER_DB:-100}"
  TC_VIRTUAL_DB_COUNT: "${TC_VIRTUAL_DB_COUNT:-1000}"
  TC_VIRTUAL_TABLE_COUNT: "${TC_VIRTUAL_TABLE_COUNT:-10000}"
  TC_SHARD_ROUTE_VERSION: "${TC_SHARD_ROUTE_VERSION:-1}"

services:
  raft-1:
    build: .
    image: trade-core-node
    command: ["exec raft-multi-node 1 ${TC_RAFT_GROUPS:-4} /data"]
    environment: *raft-environment
    ports: ["9301:9001", "9201:9102", "9401:9011", "9211:9112", "9501:9021", "9221:9122", "9601:9031", "9231:9132"]
    volumes: ["raft-1-data:/data"]
    ulimits: { nofile: { soft: 65536, hard: 65536 } }
    healthcheck: { test: ["CMD", "raft-multi-node", "probe", "/healthz", "9102", "9112", "9122", "9132"], interval: 5s, timeout: 4s, retries: 12, start_period: 120s }
    restart: unless-stopped
  raft-2:
    image: trade-core-node
    command: ["exec raft-multi-node 2 ${TC_RAFT_GROUPS:-4} /data"]
    environment: *raft-environment
